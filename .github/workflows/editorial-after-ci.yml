name: Возобновление редакции после CI

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  resume:
    if: >-
      github.repository == 'Stolyarovmn/relocant-media' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha &&
      vars.ACTIONS_EDITORIAL_ENABLED == 'true' &&
      vars.ACTIONS_CUTOVER_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Запустить штатный цикл для проверенной версии main
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          import os
          import re
          import subprocess

          repo = "Stolyarovmn/relocant-media"
          run_id, sha = os.environ["CI_RUN_ID"], os.environ["CI_SHA"]
          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id) or not re.fullmatch(r"[a-f0-9]{40}", sha):
              raise SystemExit("editorial_resume=invalid_ci")

          def api(path, field):
              return subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/{path}", "--jq", field], text=True,
              ).strip()

          if api(f"actions/runs/{run_id}", ".path") != ".github/workflows/ci.yml":
              print("editorial_resume=wrong_ci_workflow")
          elif api("git/ref/heads/main", ".object.sha") != sha:
              print("editorial_resume=main_advanced")
          else:
              subprocess.run(
                  ["gh", "workflow", "run", "editorial-actions.yml", "-R", repo,
                   "--ref", "main", "-f", "mode=auto"],
                  check=True,
              )
              print(f"editorial_resume=dispatched ci_run={run_id} sha={sha}")
