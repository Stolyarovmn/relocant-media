name: daily-analysis

on:
  workflow_dispatch:
  # Keep manual: enabling a daily schedule is a separate operational decision.

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Read saved public projection without executing data branch code
        id: snapshot
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: newsroom-data
          path: saved-public-projection
          sparse-checkout: dashboard-data/latest.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build evidence-based operational status
        env:
          SNAPSHOT_FETCH_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          EXTRA_ARGS=()
          if [ "$SNAPSHOT_FETCH_OUTCOME" != success ]; then
            EXTRA_ARGS=(--snapshot-unavailable)
          fi
          python -m relocant_media.ops.daily_analysis \
            --snapshot saved-public-projection/dashboard-data/latest.json \
            --output daily-output "${EXTRA_ARGS[@]}"
          cat daily-output/status.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: daily-output/
          if-no-files-found: error
          retention-days: 30
