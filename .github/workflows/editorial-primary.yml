name: editorial-primary

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-primary
  cancel-in-progress: false

jobs:
  editorial:
    if: vars.EDITORIAL_PRIMARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: staging
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      JEV_ENABLED: ${{ vars.JEV_ENABLED || 'false' }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TELEGRAM_RUNTIME_ENABLED: "false"
      TELEGRAM_MTPROTO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Validate optional Jev configuration
        if: env.JEV_ENABLED == 'true'
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::error::JEV_ENABLED=true but TYPESAFE_API_KEY is not configured"
            exit 1
          fi
      - name: Prepare bounded editorial batch with durable checkpoint
        run: python -m relocant_media.ops.primary_cycle --city belgrade --output "outputs/primary/${GITHUB_RUN_ID}"
      - name: Collect Jev shadow duplicate report
        if: env.JEV_ENABLED == 'true'
        continue-on-error: true
        run: |
          python -m relocant_media.ops.newsroom_status \
            --database \
            --city belgrade \
            --limit 100 \
            --shadow-duplicates \
            > "outputs/primary/${GITHUB_RUN_ID}/jev-shadow-duplicates.json"
      - name: Upload editorial run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-primary-${{ github.run_id }}
          path: outputs/primary/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
