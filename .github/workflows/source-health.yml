name: source-health

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce scheduled-run contention.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Source health placeholder
        run: |
          echo "Source-health implementation is intentionally pending verified source registry."
