name: source-health

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce scheduled-run contention.
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - ".github/workflows/source-health.yml"
      - ".github/actions/install-python/**"
      - "requirements/**"
      - "scripts/install_python.py"
      - "cities/belgrade/sources/**"
      - "docs/serbian-news-discovery.json"
      - "src/relocant_media/collectors/**"
      - "src/relocant_media/ops/source_audit.py"
      - "src/relocant_media/ops/source_silence.py"
      - "src/relocant_media/ops/changed_source_ids.py"
      - "src/relocant_media/sources/**"

permissions:
  contents: read

concurrency:
  group: source-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR strict probes compare the real base/head source YAML files.
          fetch-depth: 0
      - uses: ./.github/actions/install-python
      - name: Restore source check history
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/source-health-silence.json
          key: source-health-silence-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-health-silence-v1-
      - name: Audit registered sources
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          state=()
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            state+=(--silence-state "$RUNNER_TEMP/source-health-silence.json")
          fi
          python -m relocant_media.ops.source_audit \
            --online \
            --check-belgrade-weather \
            --check-news-discovery \
            --fail-on-error \
            --require-active \
            --summary "$GITHUB_STEP_SUMMARY" "${state[@]}"
      - name: Save source check history
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request' && steps.audit.outputs.silence_history_saved == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/source-health-silence.json
          key: source-health-silence-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Strict audit changed source configs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          CHANGED_FILES="$RUNNER_TEMP/changed-source-files.txt"
          CHANGED_IDS="$RUNNER_TEMP/changed-source-ids.txt"

          git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA" "$HEAD_SHA" \
            -- 'cities/belgrade/sources/*.yaml' >"$CHANGED_FILES"

          python -m relocant_media.ops.changed_source_ids \
            <"$CHANGED_FILES" >"$CHANGED_IDS"

          mapfile -t SOURCE_IDS <"$CHANGED_IDS"
          if (( ${#SOURCE_IDS[@]} == 0 )); then
            echo "No changed current source YAML files require a strict online probe."
            exit 0
          fi

          ARGS=()
          for SOURCE_ID in "${SOURCE_IDS[@]}"; do
            echo "Strict online probe: ${SOURCE_ID}"
            ARGS+=(--source-id "$SOURCE_ID")
          done

          python -m relocant_media.ops.source_audit \
            --online \
            --fail-on-error \
            --fail-on-partial \
            --fail-on-transport \
            "${ARGS[@]}"
