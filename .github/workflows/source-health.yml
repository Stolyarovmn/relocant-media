name: source-health

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce scheduled-run contention.
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - ".github/workflows/source-health.yml"
      - "cities/belgrade/sources/**"
      - "src/relocant_media/collectors/**"
      - "src/relocant_media/ops/source_audit.py"
      - "src/relocant_media/sources/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Audit registered sources
        run: |
          python -m relocant_media.ops.source_audit \
            --online \
            --fail-on-error \
            --require-active \
            --summary "$GITHUB_STEP_SUMMARY"
