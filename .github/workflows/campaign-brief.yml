name: campaign-brief

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - prompts/belgrade-acquisition-brief.md
      - src/relocant_media/ops/campaign_brief.py
      - .github/workflows/campaign-brief.yml

permissions:
  contents: read

concurrency:
  group: campaign-brief
  cancel-in-progress: false

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Same default as .env.example; override with the repository variable if needed.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Request one Gemini proposal without publication or ad spend
        run: python -m relocant_media.ops.campaign_brief
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belgrade-campaign-proposal
          path: campaign-output/
          if-no-files-found: error
          retention-days: 30
