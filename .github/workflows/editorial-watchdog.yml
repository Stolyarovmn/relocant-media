name: Editorial Watchdog
run-name: >-
  ${{ !inputs.dry_run && !inputs.test_intake_notification &&
    ((inputs.morning_date && format('Утренняя сводка · {0}', inputs.morning_date)) ||
      (inputs.evening_date && format('Вечерняя сводка · {0}', inputs.evening_date)))
    || inputs.editorial_only && !inputs.dry_run && 'Editorial Watchdog · редакция'
    || 'Editorial Watchdog' }}
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_run:
    workflows: [Editorial Actions]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check state without sending alerts or recovering a snapshot
        type: boolean
        default: true
      test_intake_notification:
        description: Send one clearly labelled test notification to the private owner
        type: boolean
        default: false
      editorial_only:
        description: Check editorial state and digests without checking reader intake
        type: boolean
        default: false
      morning_date:
        description: Check only this Belgrade morning issue date (YYYY-MM-DD)
        type: string
        required: false
      evening_date:
        description: Проверить вечерний выпуск Белграда за указанную дату (YYYY-MM-DD)
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: editorial-watchdog
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'workflow_run' &&
      !inputs.morning_date && !inputs.evening_date &&
      !inputs.editorial_only &&
      vars.ACTIONS_EDITORIAL_ENABLED == 'true' &&
      vars.ACTIONS_CUTOVER_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .reader-intake-alert-state.json
          key: reader-intake-alert-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reader-intake-alert-v1-
      - name: Проверить доступность предложки и уведомить владельца
        id: intake
        env:
          EDITORIAL_INGRESS_TOKEN: ${{ secrets.EDITORIAL_INGRESS_TOKEN }}
          EDITORIAL_OWNER_CHAT_ID: ${{ vars.EDITORIAL_OWNER_CHAT_ID }}
          EDITORIAL_OWNER_USER_ID: ${{ vars.EDITORIAL_OWNER_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_intake_notification }}
        run: |
          set -euo pipefail
          umask 077
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ "$TEST_NOTIFICATION" = true ]; then args+=(--test-notification); fi
          python -m relocant_media.ops.intake_watchdog --state .reader-intake-alert-state.json "${args[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.intake.outputs.changed == 'true'
        with:
          path: .reader-intake-alert-state.json
          key: reader-intake-alert-v1-${{ github.run_id }}-${{ github.run_attempt }}
  check:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_sha == github.sha &&
         github.event.workflow_run.path == '.github/workflows/editorial-actions.yml' &&
         (github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out'))) &&
      !(github.event_name == 'workflow_dispatch' && inputs.test_intake_notification) &&
      vars.ACTIONS_EDITORIAL_ENABLED == 'true' &&
      vars.ACTIONS_CUTOVER_CONFIRMED == 'true' &&
      vars.EDITORIAL_STORAGE_BACKEND == 'ssh'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .editorial-watchdog-state
          key: editorial-watchdog-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            editorial-watchdog-v2-
            editorial-watchdog-v1-
      - name: Check queue and reconcile verified checkpoints
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_PRIVATE_KEY: ${{ secrets.EDITORIAL_SSH_PRIVATE_KEY }}
          STORAGE_KNOWN_HOSTS: ${{ secrets.EDITORIAL_SSH_KNOWN_HOSTS }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_OWNER_CHAT_ID: ${{ vars.EDITORIAL_OWNER_CHAT_ID }}
          EDITORIAL_OWNER_USER_ID: ${{ vars.EDITORIAL_OWNER_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EDITORIAL_SEND_ENABLED: ${{ vars.ACTIONS_SEND_ENABLED }}
          EDITORIAL_CHANNEL_MODE: public
          MORNING_DATE: ${{ inputs.morning_date }}
          EVENING_DATE: ${{ inputs.evening_date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          umask 077
          identity="$RUNNER_TEMP/editorial-watchdog-identity"
          mkdir "$identity"
          trap 'rm -rf "$identity" "$RUNNER_TEMP/editorial-watchdog-recovery"' EXIT
          printf '%s\n' "$STORAGE_PRIVATE_KEY" > "$identity/key"
          printf '%s\n' "$STORAGE_KNOWN_HOSTS" > "$identity/known_hosts"
          export EDITORIAL_SSH_KEY_PATH="$identity/key"
          export EDITORIAL_SSH_KNOWN_HOSTS_PATH="$identity/known_hosts"
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$MORNING_DATE" ]; then args+=(--morning-date "$MORNING_DATE"); fi
          if [ -n "$EVENING_DATE" ]; then args+=(--evening-date "$EVENING_DATE"); fi
          python -m relocant_media.ops.editorial_watchdog --state .editorial-watchdog-state \
            --work "$RUNNER_TEMP/editorial-watchdog-recovery" "${args[@]}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.check.outputs.changed == 'true'
        with:
          path: .editorial-watchdog-state
          key: editorial-watchdog-v2-${{ github.run_id }}-${{ github.run_attempt }}
