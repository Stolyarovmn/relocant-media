name: Editorial Actions
run-name: >-
  Editorial Actions · ${{ (inputs.mode == 'auto' ||
  (github.event_name == 'schedule' &&
   github.event.schedule != '30 5,6 * * *' && github.event.schedule != '30 18,19 * * *'))
  && 'automatic' || inputs.mode || 'digest' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preview or canonical worker (requires completed cutover)
        type: choice
        options: [preview, editorial, intake, discovery, auto, recovery, fallback-preview, fallback, map-backfill, map-republish, map-republish-review, digest, digest-preview, drain, drain-close]
        default: preview
      preflight_retry:
        description: One replacement for a cycle stopped before opening state
        type: boolean
        default: false
      digest_preview_at:
        description: 'Digest preview only: timestamp with offset, e.g. 2026-11-14T07:30:00+01:00'
        type: string
        required: false
        default: ''
      discovery_batch:
        description: 'Discovery only: JSON {"version":1,"city":"belgrade","urls":["https://..."]}'
        type: string
        required: false
        default: ''
      recovery_run_id:
        description: Interrupted run ID (recovery only)
        type: string
        required: false
      recovery_checkpoint:
        description: Checkpoint SHA256 printed by the interrupted run (recovery only)
        type: string
        required: false
      fallback_blob_sha256:
        description: SHA256 of the private GPT result or evidence refresh request
        type: string
        required: false
      fallback_cycle_id:
        description: Optional exact scheduler run ID for GPT fallback preview
        type: string
        required: false
      map_targets:
        description: Existing post and event pairs for map-backfill
        type: string
        required: false
      map_republication:
        description: Latest message and map event JSON for republication or review export
        type: string
        required: false
      drain_before:
        description: 'Drain: фиксированный cutoff ISO UTC, не в будущем'
        type: string
        required: false
        default: ''
      drain_max_attempts:
        description: 'Drain: предел обработок одного запуска, от 1 до 30'
        type: number
        required: false
        default: 10
      drain_max_seconds:
        description: 'Drain: предел времени одного запуска, от 1 до 900 секунд'
        type: number
        required: false
        default: 300
      drain_runs_left:
        description: 'Drain: оставшийся предел запусков цепочки, от 1 до 200'
        type: number
        required: false
        default: 1
  schedule:
    # Scheduled runs are best effort; each worker has an independent backup slot.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
    - cron: '2,7,12,22,27,32,37,42,52,57 * * * *'
    - cron: '9,29,49 * * * *'
    # The worker gates dates and local time; use both UTC offsets for morning and evening.
    - cron: '30 5,6 * * *'
    - cron: '30 18,19 * * *'
permissions:
  contents: read
concurrency:
  # Digest sends and previews must survive automatic retries and each other.
  # All modes use the same state lock below.
  group: >-
    ${{ inputs.mode == 'drain-close' && 'editorial-close-backlog'
    || inputs.mode == 'drain' && 'editorial-manual-drain'
    || inputs.mode == 'fallback' && format('editorial-subscription-gpt-result-{0}', inputs.fallback_blob_sha256)
    || inputs.mode == 'fallback-preview' && format('editorial-subscription-gpt-preview-{0}', inputs.fallback_cycle_id || 'latest')
    || startsWith(inputs.mode, 'map-') && 'editorial-map-operations'
    || inputs.mode == 'preview' && 'editorial-preview'
    || inputs.mode == 'digest-preview' && 'editorial-digest-preview'
    || (inputs.mode == 'digest' || github.event.schedule == '30 5,6 * * *' || github.event.schedule == '30 18,19 * * *')
       && 'editorial-digest'
    || github.event_name == 'workflow_dispatch' && inputs.mode == 'editorial' && 'editorial-manual-cycle'
    || github.event_name == 'workflow_dispatch' && inputs.mode == 'intake' && 'editorial-manual-intake'
    || github.event_name == 'workflow_dispatch' && inputs.mode == 'discovery' && 'editorial-manual-discovery'
    || 'canonical-editorial-writer' }}
  cancel-in-progress: false
jobs:
  cycle:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.ACTIONS_EDITORIAL_ENABLED == 'true')
    concurrency:
      group: canonical-editorial-state
      cancel-in-progress: false
      # Preserve manual corrections waiting beside the coalesced automatic worker.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
      actions: read
    outputs:
      projection: ${{ steps.projection.outputs.ready }}
      worker_mode: ${{ steps.mode.outputs.value }}
      start_status: ${{ steps.start.outputs.status }}
      drain_continue: ${{ steps.runtime.outputs.drain_continue }}
      drain_next_delay_seconds: ${{ steps.runtime.outputs.drain_next_delay_seconds }}
      morning_watch_date: ${{ steps.runtime.outputs.morning_watch_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-python
      - name: Select bounded worker mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "value=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = '30 5,6 * * *' ] || [ "$CRON" = '30 18,19 * * *' ]; then
            echo 'value=digest' >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = '17 * * * *' ] || [ "$CRON" = '47 * * * *' ]; then
            echo 'value=editorial' >> "$GITHUB_OUTPUT"
          else
            echo 'value=intake' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact main CI before any runtime side effect
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_MODE: ${{ steps.mode.outputs.value }}
          PREFLIGHT_RETRY: ${{ inputs.preflight_retry }}
          GPT_FALLBACK_BLOB_SHA256: ${{ inputs.fallback_blob_sha256 }}
          GPT_FALLBACK_CYCLE_ID: ${{ inputs.fallback_cycle_id }}
          PREFLIGHT_RETRY_ENABLED: >-
            ${{ github.repository == 'Stolyarovmn/relocant-media' &&
                vars.ACTIONS_EDITORIAL_ENABLED == 'true' &&
                vars.ACTIONS_CUTOVER_CONFIRMED == 'true' }}
        run: python src/relocant_media/ops/editorial_start.py gate
      - name: Prepare storage-only SSH identity
        if: steps.start.outputs.status == 'ready'
        id: storage
        env:
          STORAGE_BACKEND: ${{ vars.EDITORIAL_STORAGE_BACKEND || 'drive' }}
          STORAGE_PRIVATE_KEY: ${{ secrets.EDITORIAL_SSH_PRIVATE_KEY }}
          STORAGE_KNOWN_HOSTS: ${{ secrets.EDITORIAL_SSH_KNOWN_HOSTS }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          case "$STORAGE_BACKEND" in
            drive) exit 0 ;;
            ssh) ;;
            *) echo 'Unsupported editorial storage backend' >&2; exit 1 ;;
          esac
          test -n "$STORAGE_PRIVATE_KEY"
          test -n "$STORAGE_KNOWN_HOSTS"
          umask 077
          identity="$RUNNER_TEMP/editorial-storage-identity"
          mkdir "$identity"
          printf '%s\n' "$STORAGE_PRIVATE_KEY" > "$identity/key"
          printf '%s\n' "$STORAGE_KNOWN_HOSTS" > "$identity/known_hosts"
          ssh-keygen -y -P '' -f "$identity/key" > /dev/null
          EDITORIAL_SSH_KEY_PATH="$identity/key" \
          EDITORIAL_SSH_KNOWN_HOSTS_PATH="$identity/known_hosts" \
            python -m relocant_media.ops.ssh_state_client --check
          echo "key_path=$identity/key" >> "$GITHUB_OUTPUT"
          echo "known_hosts_path=$identity/known_hosts" >> "$GITHUB_OUTPUT"
      - name: Restore, claim, process, save and export
        if: steps.start.outputs.status == 'ready' && steps.mode.outputs.value != 'recovery'
        id: runtime
        env:
          EDITORIAL_STORAGE_BACKEND: ${{ vars.EDITORIAL_STORAGE_BACKEND || 'drive' }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_SSH_KEY_PATH: ${{ steps.storage.outputs.key_path }}
          EDITORIAL_SSH_KNOWN_HOSTS_PATH: ${{ steps.storage.outputs.known_hosts_path }}
          GH_STATE_REPOSITORY: ${{ vars.EDITORIAL_STATE_REPOSITORY }}
          GH_STATE_TOKEN: ${{ secrets.EDITORIAL_STATE_TOKEN || github.token }}
          DRIVE_CREDENTIALS_JSON: ${{ secrets.DRIVE_CREDENTIALS_JSON }}
          DRIVE_STATE_FOLDER_ID: ${{ vars.DRIVE_STATE_FOLDER_ID }}
          DRIVE_PREVIEW_MANIFEST_ID: ${{ vars.DRIVE_PREVIEW_MANIFEST_ID }}
          ACTIONS_CUTOVER_CONFIRMED: ${{ vars.ACTIONS_CUTOVER_CONFIRMED }}
          GEMINI_API_KEY: ${{ steps.mode.outputs.value != 'drain-close' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_DRAFT: ${{ vars.GEMINI_MODEL_DRAFT }}
          GEMINI_MODEL_REVIEW: ${{ vars.GEMINI_MODEL_REVIEW }}
          TELEGRAM_BOT_TOKEN: ${{ steps.mode.outputs.value != 'drain-close' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          EDITORIAL_SEND_ENABLED: ${{ steps.mode.outputs.value != 'drain-close' && vars.ACTIONS_SEND_ENABLED || 'false' }}
          EDITORIAL_CHANNEL_MODE: public
          EDITORIAL_PRIVATE_INTAKE_ENABLED: ${{ vars.ACTIONS_PRIVATE_INTAKE_ENABLED || 'false' }}
          EDITORIAL_PRIVATE_FEEDBACK_ENABLED: ${{ vars.ACTIONS_PRIVATE_FEEDBACK_ENABLED || 'false' }}
          EDITORIAL_INGRESS_TOKEN: ${{ secrets.EDITORIAL_INGRESS_TOKEN }}
          EDITORIAL_OWNER_REVIEW_ENABLED: ${{ vars.ACTIONS_OWNER_REVIEW_ENABLED || 'false' }}
          EDITORIAL_OWNER_USER_ID: ${{ vars.EDITORIAL_OWNER_USER_ID }}
          EDITORIAL_OWNER_CHAT_ID: ${{ vars.EDITORIAL_OWNER_CHAT_ID }}
          JEV_ENABLED: ${{ vars.JEV_ENABLED || 'false' }}
          TYPESAFE_API_KEY: ${{ steps.mode.outputs.value != 'drain-close' && secrets.TYPESAFE_API_KEY || '' }}
          WORKER_MODE: ${{ steps.mode.outputs.value }}
          CLOUD_DISCOVERY_BATCH: ${{ inputs.discovery_batch }}
          RELOCANT_MAP_TELEGRAM_APP: ${{ vars.RELOCANT_MAP_TELEGRAM_APP }}
          DIGEST_PREVIEW_AT: ${{ inputs.digest_preview_at }}
          MAP_BACKFILL_TARGETS: ${{ inputs.map_targets }}
          MAP_REPUBLICATION_REQUEST: ${{ inputs.map_republication }}
          GPT_FALLBACK_BLOB_SHA256: ${{ inputs.fallback_blob_sha256 }}
          GPT_FALLBACK_CYCLE_ID: ${{ inputs.fallback_cycle_id }}
          DRAIN_BEFORE: ${{ inputs.drain_before }}
          DRAIN_MAX_ATTEMPTS: ${{ inputs.drain_max_attempts }}
          DRAIN_MAX_SECONDS: ${{ inputs.drain_max_seconds }}
          DRAIN_RUNS_LEFT: ${{ inputs.drain_runs_left }}
        run: |
          mkdir -p _site
          rm -f _site/data.json
          python -m relocant_media.ops.actions_runtime --mode "$WORKER_MODE" \
            --work "$RUNNER_TEMP/editorial-work" --output _site/data.json \
            --map-output _site/map/incidents.json
      - name: Reconcile interrupted writer from verified checkpoint
        if: steps.start.outputs.status == 'ready' && steps.mode.outputs.value == 'recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          EDITORIAL_STORAGE_BACKEND: ${{ vars.EDITORIAL_STORAGE_BACKEND || 'drive' }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_SSH_KEY_PATH: ${{ steps.storage.outputs.key_path }}
          EDITORIAL_SSH_KNOWN_HOSTS_PATH: ${{ steps.storage.outputs.known_hosts_path }}
          ACTIONS_CUTOVER_CONFIRMED: ${{ vars.ACTIONS_CUTOVER_CONFIRMED }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_CHECKPOINT: ${{ inputs.recovery_checkpoint }}
        run: |
          python -m relocant_media.ops.actions_recovery --run-id "$RECOVERY_RUN_ID" \
            --checkpoint "$RECOVERY_CHECKPOINT" --work "$RUNNER_TEMP/editorial-work"
      - name: Report saved editorial decisions
        if: >-
          steps.runtime.outcome == 'success' &&
          (steps.mode.outputs.value == 'editorial' || steps.mode.outputs.value == 'auto') &&
          vars.EDITORIAL_STORAGE_BACKEND == 'ssh'
        env:
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_SSH_KEY_PATH: ${{ steps.storage.outputs.key_path }}
          EDITORIAL_SSH_KNOWN_HOSTS_PATH: ${{ steps.storage.outputs.known_hosts_path }}
        run: |
          python -m relocant_media.ops.editorial_cycle_observation \
            --snapshot "$RUNNER_TEMP/editorial-work/saved/editorial.sqlite3"
      - name: Publish only sanitized projection
        if: >-
          always() && steps.start.outputs.status == 'ready' && steps.mode.outputs.value != 'recovery' &&
          steps.mode.outputs.value != 'fallback-preview' &&
          steps.mode.outputs.value != 'digest-preview' && !startsWith(inputs.mode, 'map-')
        id: projection
        env:
          NEWSROOM_GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_OUTCOME: ${{ job.status == 'failure' && 'failure' || steps.runtime.outcome }}
          WORKER_MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p _site
          python -m relocant_media.ops.pages_assets --site _site
          previous="$RUNNER_TEMP/newsroom-previous.json"
          rm -f "$previous"
          python -m relocant_media.ops.newsroom_attempt --output _site/data.json \
            --previous "$previous" --fetch-previous --outcome "${RUNTIME_OUTCOME:-skipped}" \
            --mode "${WORKER_MODE:-not_selected}" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python -m relocant_media.ops.newsroom_publish --snapshot _site/data.json \
            --map-snapshot _site/map/incidents.json --events-snapshot _site/map/events.json
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Save public Pages projection only
        if: always() && steps.projection.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove private working files
        if: always()
        run: rm -rf "$RUNNER_TEMP/editorial-work" "$RUNNER_TEMP/editorial-storage-identity"
  start_retry:
    # Ожидание CI проходит после освобождения канонической очереди.
    if: >-
      github.repository == 'Stolyarovmn/relocant-media' && github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' && !inputs.preflight_retry &&
      vars.ACTIONS_EDITORIAL_ENABLED == 'true' && vars.ACTIONS_CUTOVER_CONFIRMED == 'true' &&
      needs.cycle.result == 'success' &&
      (needs.cycle.outputs.start_status == 'superseded' ||
       needs.cycle.outputs.start_status == 'ci_pending')
    needs: cycle
    concurrency:
      group: editorial-start-retry-${{ needs.cycle.outputs.worker_mode }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Дождаться точного CI и однократно поставить прежний режим в очередь
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_MODE: ${{ needs.cycle.outputs.worker_mode }}
          GPT_FALLBACK_BLOB_SHA256: ${{ inputs.fallback_blob_sha256 }}
          GPT_FALLBACK_CYCLE_ID: ${{ inputs.fallback_cycle_id }}
        run: python src/relocant_media/ops/editorial_start.py retry
  drain_chain:
    # Ожидание не занимает job с канонической блокировкой состояния.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'drain' && needs.cycle.result == 'success' &&
      needs.cycle.outputs.drain_continue == 'true' && inputs.drain_runs_left > 1
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
    steps:
      - name: Продолжить ограниченную обработку той же очереди
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRAIN_BEFORE: ${{ inputs.drain_before }}
          DRAIN_MAX_ATTEMPTS: ${{ inputs.drain_max_attempts }}
          DRAIN_MAX_SECONDS: ${{ inputs.drain_max_seconds }}
          DRAIN_RUNS_LEFT: ${{ inputs.drain_runs_left }}
          DRAIN_DELAY: ${{ needs.cycle.outputs.drain_next_delay_seconds }}
        run: |
          python - <<'PY'
          import os, re, subprocess, time
          from datetime import UTC, datetime, timedelta
          def bounded(name, maximum):
              raw = os.environ[name]
              if not re.fullmatch(r'[1-9][0-9]{0,3}', raw) or int(raw) > maximum:
                  raise SystemExit('Неверные границы продолжения drain')
              return int(raw)
          left = bounded('DRAIN_RUNS_LEFT', 200)
          attempts = bounded('DRAIN_MAX_ATTEMPTS', 30)
          seconds = bounded('DRAIN_MAX_SECONDS', 900)
          before = os.environ['DRAIN_BEFORE']
          cutoff = datetime.fromisoformat(before)
          if (cutoff.tzinfo is None or cutoff.utcoffset() != timedelta()
                  or cutoff > datetime.now(UTC) or left <= 1):
              raise SystemExit('Неверный cutoff или исчерпан предел продолжения drain')
          delay = os.environ['DRAIN_DELAY']
          if not re.fullmatch(r'[0-9]{1,5}', delay) or not 60 <= int(delay) <= 21000:
              raise SystemExit('Неверная задержка продолжения drain')
          until = time.monotonic() + int(delay)
          while (remaining := until - time.monotonic()) > 0:
              time.sleep(min(60, remaining))
          subprocess.run(['gh', 'workflow', 'run', 'editorial-actions.yml', '--ref', 'main',
              '-f', 'mode=drain', '-f', f'drain_before={before}',
              '-f', f'drain_max_attempts={attempts}', '-f', f'drain_max_seconds={seconds}',
              '-f', f'drain_runs_left={left-1}'], check=True, stdout=subprocess.DEVNULL)
          PY
  chain:
    # Book the delay outside the writer workflow so it can release its queue.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'auto') &&
      (needs.cycle.result == 'success' || needs.cycle.result == 'failure') &&
      needs.cycle.outputs.start_status != 'superseded' &&
      needs.cycle.outputs.start_status != 'ci_pending' &&
      needs.cycle.outputs.start_status != 'ci_failed' &&
      vars.ACTIONS_EDITORIAL_ENABLED == 'true' && vars.ACTIONS_CHAIN_ENABLED == 'true' &&
      inputs.mode != 'preview' && inputs.mode != 'recovery' &&
      inputs.mode != 'digest' && inputs.mode != 'digest-preview' &&
      needs.cycle.outputs.worker_mode != 'digest' &&
      inputs.mode != 'fallback-preview' && inputs.mode != 'fallback' && !startsWith(inputs.mode, 'map-')
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Запланировать следующий цикл
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CYCLE_RESULT: ${{ needs.cycle.result }}
          CYCLE_SHA: ${{ github.sha }}
          CYCLE_RUN_ID: ${{ github.run_id }}
        run: |
          import os
          import subprocess

          subprocess.run([
              'gh', 'workflow', 'run', 'editorial-retry.yml', '-R', os.environ['GH_REPO'],
              '--ref', 'main', '-f', f"result={os.environ['CYCLE_RESULT']}",
              '-f', f"source_sha={os.environ['CYCLE_SHA']}",
              '-f', f"source_run_id={os.environ['CYCLE_RUN_ID']}",
          ], check=True)
      - name: Запустить монитор при пропуске расписания
        id: watchdog-backup
        if: >-
          always() && vars.EDITORIAL_STORAGE_BACKEND == 'ssh' &&
          vars.ACTIONS_CUTOVER_CONFIRMED == 'true'
        continue-on-error: true
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json
          import os
          import subprocess
          from datetime import UTC, datetime, timedelta

          repo = os.environ['GH_REPO']
          workflow = 'editorial-watchdog.yml'
          cutoff = datetime.now(UTC) - timedelta(minutes=20)
          recent = json.loads(subprocess.check_output([
              'gh', 'run', 'list', '-R', repo, '--workflow', workflow, '--branch', 'main',
              '--limit', '20', '--json', 'displayTitle,status,conclusion,event,createdAt,updatedAt',
          ], text=True, encoding='utf-8', timeout=30))

          def has_recent_check(run):
              if run['status'] != 'completed':
                  return datetime.fromisoformat(run['createdAt']) >= cutoff
              scheduled = run['event'] in ('schedule', 'workflow_run')
              backup = run['displayTitle'] == 'Editorial Watchdog · редакция'
              return ((scheduled or backup)
                      and run['conclusion'] == 'success'
                      and datetime.fromisoformat(run['updatedAt']) >= cutoff)

          if any(map(has_recent_check, recent)):
              print('Монитор недавно проверил редакцию или уже выполняется.')
          else:
              subprocess.run([
                  'gh', 'workflow', 'run', workflow, '-R', repo, '--ref', 'main',
                  '-f', 'dry_run=false', '-f', 'editorial_only=true',
              ], check=True, timeout=30)
      - name: Проверить пропущенную утреннюю сводку
        if: always() && needs.cycle.outputs.morning_watch_date != ''
        continue-on-error: true
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MORNING_DATE: ${{ needs.cycle.outputs.morning_watch_date }}
        run: |
          import json
          import os
          import subprocess
          from datetime import date

          issue_date = os.environ['MORNING_DATE']
          if date.fromisoformat(issue_date).isoformat() != issue_date:
              raise SystemExit('Неверная дата утренней сводки')
          repo = os.environ['GH_REPO']
          workflow = 'editorial-watchdog.yml'
          title = f'Утренняя сводка · {issue_date}'
          recent = json.loads(subprocess.check_output([
              'gh', 'run', 'list', '-R', repo, '--workflow', workflow, '--branch', 'main',
              '--event', 'workflow_dispatch', '--limit', '20',
              '--json', 'displayTitle,status,conclusion',
          ], text=True, encoding='utf-8', timeout=40))
          if any(run['displayTitle'] == title and (
              run['status'] != 'completed' or run['conclusion'] == 'success'
          ) for run in recent):
              print('Проверка этой сводки уже запущена или завершена.')
          else:
              subprocess.run([
                  'gh', 'workflow', 'run', workflow, '-R', repo, '--ref', 'main',
                  '-f', 'dry_run=false', '-f', f'morning_date={issue_date}',
              ], check=True, timeout=40)
  deploy:
    if: always() && needs.cycle.outputs.projection == 'true'
    needs: cycle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: newsroom-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip a superseded Pages build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$actual" = "$EXPECTED_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
