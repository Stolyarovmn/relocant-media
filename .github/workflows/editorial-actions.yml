name: Editorial Actions
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preview or canonical worker (requires completed cutover)
        type: choice
        options: [preview, editorial, intake, discovery, auto, recovery, fallback-preview, fallback, map-backfill, map-republish, map-republish-review, digest]
        default: preview
      discovery_batch:
        description: 'Discovery only: JSON {"version":1,"city":"belgrade","urls":["https://..."]}'
        type: string
        required: false
        default: ''
      recovery_run_id:
        description: Interrupted run ID (recovery only)
        type: string
        required: false
      recovery_checkpoint:
        description: Checkpoint SHA256 printed by the interrupted run (recovery only)
        type: string
        required: false
      fallback_blob_sha256:
        description: SHA256 of the private GPT result (fallback or map-republish)
        type: string
        required: false
      map_targets:
        description: Existing post and event pairs for map-backfill
        type: string
        required: false
      map_republication:
        description: Latest message and map event JSON for republication or review export
        type: string
        required: false
  schedule:
    # Scheduled runs are best effort; each worker has an independent backup slot.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
    - cron: '2,7,12,22,27,32,37,42,52,57 * * * *'
    - cron: '9,29,49 * * * *'
    # The worker gates dates and local time; use both UTC offsets for evening reminders.
    - cron: '30 6 13-27 11 *'
    - cron: '30 18,19 * * *'
permissions:
  contents: read
concurrency:
  # Keep manually requested edits and subscription runs out of the automatic queue.
  # All modes use the same state lock below.
  group: ${{ startsWith(inputs.mode, 'fallback') && 'editorial-subscription-gpt' || startsWith(inputs.mode, 'map-') && 'editorial-map-operations' || 'canonical-editorial-writer' }}
  cancel-in-progress: false
jobs:
  cycle:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.ACTIONS_EDITORIAL_ENABLED == 'true')
    concurrency:
      group: canonical-editorial-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: write
      actions: read
    outputs:
      projection: ${{ steps.projection.outputs.ready }}
      worker_mode: ${{ steps.mode.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Select bounded worker mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "value=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = '30 6 13-27 11 *' ] || [ "$CRON" = '30 18,19 * * *' ]; then
            echo 'value=digest' >> "$GITHUB_OUTPUT"
          elif [ "$CRON" = '17 * * * *' ] || [ "$CRON" = '47 * * * *' ]; then
            echo 'value=editorial' >> "$GITHUB_OUTPUT"
          else
            echo 'value=intake' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact main CI before any runtime side effect
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = 'Stolyarovmn/relocant-media'
          sha = os.environ['EXPECTED_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          assert api('git/ref/heads/main')['object']['sha'] == sha, 'main advanced; retry current main'
          runs = api(f'actions/runs?head_sha={sha}&event=push&per_page=100')['workflow_runs']
          ci = [r for r in runs if r['path'] == '.github/workflows/ci.yml'
                and r['head_branch'] == 'main' and r['event'] == 'push']
          assert ci and ci[0]['status'] == 'completed' and ci[0]['conclusion'] == 'success'
          PY
      - name: Prepare storage-only SSH identity
        id: storage
        env:
          STORAGE_BACKEND: ${{ vars.EDITORIAL_STORAGE_BACKEND || 'drive' }}
          STORAGE_PRIVATE_KEY: ${{ secrets.EDITORIAL_SSH_PRIVATE_KEY }}
          STORAGE_KNOWN_HOSTS: ${{ secrets.EDITORIAL_SSH_KNOWN_HOSTS }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          case "$STORAGE_BACKEND" in
            drive) exit 0 ;;
            ssh) ;;
            *) echo 'Unsupported editorial storage backend' >&2; exit 1 ;;
          esac
          test -n "$STORAGE_PRIVATE_KEY"
          test -n "$STORAGE_KNOWN_HOSTS"
          umask 077
          identity="$RUNNER_TEMP/editorial-storage-identity"
          mkdir "$identity"
          printf '%s\n' "$STORAGE_PRIVATE_KEY" > "$identity/key"
          printf '%s\n' "$STORAGE_KNOWN_HOSTS" > "$identity/known_hosts"
          ssh-keygen -y -P '' -f "$identity/key" > /dev/null
          EDITORIAL_SSH_KEY_PATH="$identity/key" \
          EDITORIAL_SSH_KNOWN_HOSTS_PATH="$identity/known_hosts" \
            python -m relocant_media.ops.ssh_state_client --check
          echo "key_path=$identity/key" >> "$GITHUB_OUTPUT"
          echo "known_hosts_path=$identity/known_hosts" >> "$GITHUB_OUTPUT"
      - name: Restore, claim, process, save and export
        if: steps.mode.outputs.value != 'recovery'
        id: runtime
        env:
          EDITORIAL_STORAGE_BACKEND: ${{ vars.EDITORIAL_STORAGE_BACKEND || 'drive' }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_SSH_KEY_PATH: ${{ steps.storage.outputs.key_path }}
          EDITORIAL_SSH_KNOWN_HOSTS_PATH: ${{ steps.storage.outputs.known_hosts_path }}
          GH_STATE_REPOSITORY: ${{ vars.EDITORIAL_STATE_REPOSITORY }}
          GH_STATE_TOKEN: ${{ secrets.EDITORIAL_STATE_TOKEN || github.token }}
          DRIVE_CREDENTIALS_JSON: ${{ secrets.DRIVE_CREDENTIALS_JSON }}
          DRIVE_STATE_FOLDER_ID: ${{ vars.DRIVE_STATE_FOLDER_ID }}
          DRIVE_PREVIEW_MANIFEST_ID: ${{ vars.DRIVE_PREVIEW_MANIFEST_ID }}
          ACTIONS_CUTOVER_CONFIRMED: ${{ vars.ACTIONS_CUTOVER_CONFIRMED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EDITORIAL_SEND_ENABLED: ${{ vars.ACTIONS_SEND_ENABLED || 'false' }}
          EDITORIAL_CHANNEL_MODE: public
          EDITORIAL_PRIVATE_INTAKE_ENABLED: ${{ vars.ACTIONS_PRIVATE_INTAKE_ENABLED || 'false' }}
          EDITORIAL_PRIVATE_FEEDBACK_ENABLED: ${{ vars.ACTIONS_PRIVATE_FEEDBACK_ENABLED || 'false' }}
          EDITORIAL_OWNER_REVIEW_ENABLED: ${{ vars.ACTIONS_OWNER_REVIEW_ENABLED || 'false' }}
          EDITORIAL_OWNER_USER_ID: ${{ vars.EDITORIAL_OWNER_USER_ID }}
          EDITORIAL_OWNER_CHAT_ID: ${{ vars.EDITORIAL_OWNER_CHAT_ID }}
          JEV_ENABLED: ${{ vars.JEV_ENABLED || 'false' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          WORKER_MODE: ${{ steps.mode.outputs.value }}
          CLOUD_DISCOVERY_BATCH: ${{ inputs.discovery_batch }}
          RELOCANT_MAP_TELEGRAM_APP: ${{ vars.RELOCANT_MAP_TELEGRAM_APP }}
          MAP_BACKFILL_TARGETS: ${{ inputs.map_targets }}
          MAP_REPUBLICATION_REQUEST: ${{ inputs.map_republication }}
          GPT_FALLBACK_BLOB_SHA256: ${{ inputs.fallback_blob_sha256 }}
        run: |
          mkdir -p _site
          rm -f _site/data.json
          python -m relocant_media.ops.actions_runtime --mode "$WORKER_MODE" \
            --work "$RUNNER_TEMP/editorial-work" --output _site/data.json \
            --map-output _site/map/incidents.json
      - name: Reconcile interrupted writer from verified checkpoint
        if: steps.mode.outputs.value == 'recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          EDITORIAL_STORAGE_BACKEND: ${{ vars.EDITORIAL_STORAGE_BACKEND || 'drive' }}
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_SSH_KEY_PATH: ${{ steps.storage.outputs.key_path }}
          EDITORIAL_SSH_KNOWN_HOSTS_PATH: ${{ steps.storage.outputs.known_hosts_path }}
          ACTIONS_CUTOVER_CONFIRMED: ${{ vars.ACTIONS_CUTOVER_CONFIRMED }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_CHECKPOINT: ${{ inputs.recovery_checkpoint }}
        run: |
          python -m relocant_media.ops.actions_recovery --run-id "$RECOVERY_RUN_ID" \
            --checkpoint "$RECOVERY_CHECKPOINT" --work "$RUNNER_TEMP/editorial-work"
      - name: Report saved editorial decisions
        if: >-
          steps.runtime.outcome == 'success' &&
          (steps.mode.outputs.value == 'editorial' || steps.mode.outputs.value == 'auto') &&
          vars.EDITORIAL_STORAGE_BACKEND == 'ssh'
        env:
          EDITORIAL_SSH_HOST: ${{ vars.EDITORIAL_SSH_HOST }}
          EDITORIAL_SSH_USER: ${{ vars.EDITORIAL_SSH_USER }}
          EDITORIAL_SSH_PORT: ${{ vars.EDITORIAL_SSH_PORT || '22' }}
          EDITORIAL_SSH_KEY_PATH: ${{ steps.storage.outputs.key_path }}
          EDITORIAL_SSH_KNOWN_HOSTS_PATH: ${{ steps.storage.outputs.known_hosts_path }}
        run: |
          python -m relocant_media.ops.editorial_cycle_observation \
            --snapshot "$RUNNER_TEMP/editorial-work/saved/editorial.sqlite3"
      - name: Publish only sanitized projection
        if: >-
          always() && steps.mode.outputs.value != 'recovery' &&
          steps.mode.outputs.value != 'fallback-preview' && !startsWith(inputs.mode, 'map-')
        id: projection
        env:
          NEWSROOM_GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_OUTCOME: ${{ job.status == 'failure' && 'failure' || steps.runtime.outcome }}
          WORKER_MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p _site
          python -m relocant_media.ops.pages_assets --site _site
          previous="$RUNNER_TEMP/newsroom-previous.json"
          rm -f "$previous"
          python -m relocant_media.ops.newsroom_attempt --output _site/data.json \
            --previous "$previous" --fetch-previous --outcome "${RUNTIME_OUTCOME:-skipped}" \
            --mode "${WORKER_MODE:-not_selected}" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python -m relocant_media.ops.newsroom_publish --snapshot _site/data.json \
            --map-snapshot _site/map/incidents.json --events-snapshot _site/map/events.json
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Save public Pages projection only
        if: always() && steps.projection.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove private working files
        if: always()
        run: rm -rf "$RUNNER_TEMP/editorial-work" "$RUNNER_TEMP/editorial-storage-identity"
  chain:
    # Scheduled runs are best effort. A finished cycle books the next one, so the newsroom
    # keeps running; a failed cycle (for example the exact-main-CI guard right after a merge)
    # backs off for ten minutes instead of ending the chain. Cron slots remain the restart
    # path and ACTIONS_CHAIN_ENABLED is the kill switch. The concurrency group still
    # serializes the single canonical writer.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.cycle.result == 'success' || needs.cycle.result == 'failure') &&
      vars.ACTIONS_EDITORIAL_ENABLED == 'true' && vars.ACTIONS_CHAIN_ENABLED == 'true' &&
      inputs.mode != 'preview' && inputs.mode != 'recovery' &&
      inputs.mode != 'digest' && needs.cycle.outputs.worker_mode != 'digest' &&
      inputs.mode != 'fallback-preview' && inputs.mode != 'fallback' && !startsWith(inputs.mode, 'map-')
    needs: cycle
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Book the next cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHAIN_DELAY_SECONDS: ${{ needs.cycle.result == 'success' && '120' || '600' }}
        run: |
          set -euo pipefail
          # The concurrency group keeps at most one pending run, so this cannot pile up.
          sleep "$CHAIN_DELAY_SECONDS"
          gh workflow run editorial-actions.yml --ref main -f mode=auto
  deploy:
    if: always() && needs.cycle.outputs.projection == 'true'
    needs: cycle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: newsroom-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip a superseded Pages build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$actual" = "$EXPECTED_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
