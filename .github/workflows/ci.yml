name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relocant
          POSTGRES_PASSWORD: relocant
          POSTGRES_DB: relocant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relocant -d relocant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://relocant:relocant@127.0.0.1:5432/relocant
      TEST_DATABASE_URL: postgresql+psycopg://relocant:relocant@127.0.0.1:5432/relocant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Compare certifi and system TLS trust
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import ssl

          import httpx

          URLS = (
              "https://www.parking-servis.co.rs/lat/vesti",
              "https://srbijavoz.rs/vesti/",
          )


          async def probe(label: str, verify: bool | ssl.SSLContext) -> None:
              print(f"=== {label} ===")
              async with httpx.AsyncClient(
                  verify=verify,
                  trust_env=False,
                  timeout=20,
              ) as client:
                  for url in URLS:
                      try:
                          async with client.stream(
                              "GET",
                              url,
                              follow_redirects=False,
                              headers={
                                  "User-Agent": "RelocantMedia TLS diagnostics/1.0",
                              },
                          ) as response:
                              print(
                                  url,
                                  "OK",
                                  response.status_code,
                                  "location=",
                                  response.headers.get("location"),
                              )
                      except Exception as error:
                          print(
                              url,
                              "ERROR",
                              type(error).__name__,
                              " ".join(str(error).split())[:500],
                          )


          async def main() -> None:
              await probe("httpx-default-certifi", True)
              system_context = ssl.create_default_context()
              print(
                  "system-context",
                  "verify_mode=",
                  system_context.verify_mode.name,
                  "check_hostname=",
                  system_context.check_hostname,
              )
              await probe("python-system-default-context", system_context)


          asyncio.run(main())
          PY
      - run: ruff check .
      - run: mypy src
      - name: Validate Alembic migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q
      - name: Validate staging Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile staging config >/dev/null
      - name: Build staging API image
        run: docker build -t relocant-media:ci .