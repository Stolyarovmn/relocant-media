name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relocant
          POSTGRES_PASSWORD: relocant
          POSTGRES_DB: relocant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relocant -d relocant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://relocant:relocant@127.0.0.1:5432/relocant
      TEST_DATABASE_URL: postgresql+psycopg://relocant:relocant@127.0.0.1:5432/relocant
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply one-shot runtime patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/structured-venue-server-cycle'
        run: python .github/scripts/apply_structured_venue_server_cycle.py
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - name: Validate Alembic migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q
      - name: Validate staging Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile staging config >/dev/null
      - name: Build staging API image
        run: docker build -t relocant-media:ci .