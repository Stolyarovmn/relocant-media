name: ci

on:
  # main получает свой push-прогон: рабочие workflow ищут именно его для точного SHA.
  # Ветки с PR проверяются через pull_request, без второго такого же прогона на push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Прогон main никогда не отменяется; в PR остаётся только проверка последнего коммита.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relocant
          POSTGRES_PASSWORD: relocant
          POSTGRES_DB: relocant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relocant -d relocant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://relocant:relocant@127.0.0.1:5432/relocant
      TEST_DATABASE_URL: postgresql+psycopg://relocant:relocant@127.0.0.1:5432/relocant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/map_frontend.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify private ingress without live services
        run: |
          npm ci --prefix deploy/vercel-intake --ignore-scripts
          npm test --prefix deploy/vercel-intake
      - name: Проверить Lua CAS и зашифрованный приём на настоящем Redis
        env:
          REDIS_TEST_CONTAINER: ${{ job.services.redis.id }}
        run: |
          test -n "$REDIS_TEST_CONTAINER"
          node --test deploy/vercel-intake/test/redis-live.test.js
      - name: Validate Alembic migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q
      - name: Validate staging Compose configuration
        run: |
          cp .env.example .env
          docker compose --profile staging config >/dev/null
      - name: Build staging API image
        run: docker build -t relocant-media:ci .
