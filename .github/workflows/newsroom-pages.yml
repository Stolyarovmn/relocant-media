name: Newsroom Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/newsroom/**'
      - 'dashboard-data/latest.json'
      - 'cities/**'
      - 'docs/messenger-discovery.json'
      - 'src/relocant_media/ops/newsroom_export.py'
      - 'src/relocant_media/ops/pages_assets.py'
      - 'src/relocant_media/ops/events_export.py'
      - 'src/relocant_media/services/event_place*.py'
      - '.github/workflows/newsroom-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    branches: [newsroom-data]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: newsroom-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Record build revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-python
      - name: Build catalog and attach latest runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          python -m relocant_media.ops.pages_assets --site _site
          python -m relocant_media.ops.newsroom_export --output _site/data.json
          git fetch origin newsroom-data
          if git show FETCH_HEAD:dashboard-data/latest.json > /tmp/newsroom-runtime.json; then
            python -m relocant_media.ops.newsroom_merge --catalog _site/data.json --runtime /tmp/newsroom-runtime.json
          fi
          if git cat-file -e FETCH_HEAD:dashboard-data/map.json; then
            git show FETCH_HEAD:dashboard-data/map.json > _site/map/incidents.json
          else
            printf '{"version":1,"incidents":[]}\n' > _site/map/incidents.json
          fi
          if git cat-file -e FETCH_HEAD:dashboard-data/events.json; then
            git show FETCH_HEAD:dashboard-data/events.json > _site/map/events.json
          else
            printf '{"version":1,"events":[]}\n' > _site/map/events.json
          fi
          python -m relocant_media.ops.events_export --validate _site/map/events.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newsroom-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: 3ac22e7462fc79b1733c3e9e061ec83b
      CLOUDFLARE_PAGES_PROJECT: relocant-map
      CLOUDFLARE_MAX_FILE_BYTES: '26214400'
      WRANGLER_VERSION: 4.156.0
      EXPECTED_SHA: ${{ needs.build.outputs.revision }}
    steps:
      - name: Skip a superseded Pages build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.revision }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$actual" = "$EXPECTED_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check Cloudflare Pages credential
        id: cloudflare
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"
          else echo '::notice::CLOUDFLARE_API_TOKEN is not set; Cloudflare Pages copy skipped'; fi
      - name: Download Pages projection for Cloudflare
        if: steps.current.outputs.deploy == 'true' && steps.cloudflare.outputs.ready == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-artifact
      - name: Deploy the same projection to Cloudflare Pages
        id: cloudflare_publish
        if: steps.current.outputs.deploy == 'true' && steps.cloudflare.outputs.ready == 'true'
        continue-on-error: true
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/cloudflare-artifact
          SITE_DIR: ${{ runner.temp }}/cloudflare-site
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$SITE_DIR"
          tar -xf "$ARTIFACT_DIR/artifact.tar" -C "$SITE_DIR"
          # Cloudflare Pages rejects files over 25 MiB; fail before a partial upload.
          oversized=$(find "$SITE_DIR" -type f -size +"$CLOUDFLARE_MAX_FILE_BYTES"c -printf '%s %P\n')
          if [ -n "$oversized" ]; then
            echo "::error::Cloudflare Pages file limit exceeded:"; echo "$oversized"; exit 1
          fi
          npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$CLOUDFLARE_PAGES_PROJECT" \
            --production-branch main >/dev/null 2>&1 || true
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy "$SITE_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main \
            --commit-hash "$EXPECTED_SHA" --commit-dirty=true
      - name: Verify the two public Cloudflare map feeds
        if: steps.cloudflare_publish.outcome == 'success'
        continue-on-error: true
        env:
          SITE_DIR: ${{ runner.temp }}/cloudflare-site
        run: |
          set -euo pipefail
          observed=$(mktemp)
          trap 'rm -f -- "$observed"' EXIT
          failed=0
          for file in map/incidents.json map/events.json; do
            url="https://$CLOUDFLARE_PAGES_PROJECT.pages.dev/$file?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            matched=false
            for delay in 0 2 4; do
              sleep "$delay"
              if curl --fail --silent --show-error --proto '=https' --connect-timeout 5 \
                --max-time 10 --max-filesize "$CLOUDFLARE_MAX_FILE_BYTES" \
                -o "$observed" "$url" && cmp -s "$SITE_DIR/$file" "$observed"; then
                printf 'Cloudflare map readback verified: %s %s\n' "$file" \
                  "$(sha256sum < "$observed" | cut -d ' ' -f1)"
                matched=true
                break
              fi
            done
            if [ "$matched" != true ]; then
              echo "::error::Cloudflare map readback does not match the deployed artifact: $file"
              failed=1
            fi
          done
          exit "$failed"
