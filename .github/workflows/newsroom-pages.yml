name: Newsroom Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/newsroom/**'
      - 'dashboard-data/latest.json'
      - 'cities/**'
      - 'docs/messenger-discovery.json'
      - 'src/relocant_media/ops/newsroom_export.py'
      - 'src/relocant_media/ops/pages_assets.py'
      - 'src/relocant_media/ops/events_export.py'
      - 'src/relocant_media/services/event_place*.py'
      - '.github/workflows/newsroom-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    branches: [newsroom-data]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: newsroom-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record build revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build catalog and attach latest runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          python -m relocant_media.ops.pages_assets --site _site
          python -m relocant_media.ops.newsroom_export --output _site/data.json
          git fetch origin newsroom-data
          if git show FETCH_HEAD:dashboard-data/latest.json > /tmp/newsroom-runtime.json; then
            python -m relocant_media.ops.newsroom_merge --catalog _site/data.json --runtime /tmp/newsroom-runtime.json
          fi
          if git cat-file -e FETCH_HEAD:dashboard-data/map.json; then
            git show FETCH_HEAD:dashboard-data/map.json > _site/map/incidents.json
          else
            printf '{"version":1,"incidents":[]}\n' > _site/map/incidents.json
          fi
          if git cat-file -e FETCH_HEAD:dashboard-data/events.json; then
            git show FETCH_HEAD:dashboard-data/events.json > _site/map/events.json
          else
            printf '{"version":1,"events":[]}\n' > _site/map/events.json
          fi
          python -m relocant_media.ops.events_export --validate _site/map/events.json
      - uses: actions/upload-artifact@v4
        with:
          name: newsroom-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip a superseded Pages build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.revision }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$actual" = "$EXPECTED_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
