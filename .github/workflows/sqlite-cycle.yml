name: sqlite-cycle
on:
  workflow_call:
    inputs:
      analyze:
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: editorial-sqlite-state
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: staging
      DATABASE_URL: sqlite:///state/editorial.sqlite3
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Восстановить последнее состояние
        id: restore
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('state', {recursive: true});
            const branch = context.ref.replace('refs/heads/', '');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {...context.repo, name: 'editorial-sqlite', per_page: 100});
            const candidates = artifacts.filter(a => a.workflow_run?.head_branch === branch)
              .sort((a,b) => b.id - a.id);
            const repository = await github.rest.repos.get(context.repo);
            let latest;
            for (const artifact of candidates) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: artifact.workflow_run.id});
              if (run.head_repository?.id !== repository.data.id ||
                  !['schedule', 'workflow_dispatch'].includes(run.event) ||
                  !['.github/workflows/daily-analysis.yml',
                    '.github/workflows/source-health.yml'].includes(run.path)) continue;
              latest = artifact;
              break;
            }
            if (latest) {
              if (latest.expired) throw new Error('Состояние истекло: требуется восстановление БД');
              const response = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: latest.id, archive_format: 'zip'});
              fs.writeFileSync('state.zip', Buffer.from(response.data));
            } else {
              for (const workflow_id of ['daily-analysis.yml', 'source-health.yml']) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id, branch, status: 'completed', per_page: 1});
                for (const run of runs.data.workflow_runs) {
                  try {
                    await github.rest.repos.getContent({...context.repo,
                      path: '.github/workflows/sqlite-cycle.yml', ref: run.head_sha});
                  } catch (error) {
                    if (error.status === 404) continue;
                    throw error;
                  }
                  throw new Error('Предыдущие запуски есть, состояние отсутствует: требуется восстановление');
                }
              }
            }
      - name: Проверить файл SQLite
        id: validate
        run: |
          python - <<'PY'
          import pathlib, sqlite3, zipfile
          archive = pathlib.Path('state.zip')
          if archive.exists():
              with zipfile.ZipFile(archive) as z:
                  if z.namelist() != ['editorial.sqlite3']:
                      raise SystemExit('Неожиданное содержимое архива состояния')
                  pathlib.Path('state/editorial.sqlite3').write_bytes(z.read('editorial.sqlite3'))
              with sqlite3.connect('state/editorial.sqlite3') as db:
                  if db.execute('PRAGMA integrity_check').fetchone()[0] != 'ok':
                      raise SystemExit('Проверка целостности SQLite не пройдена')
          PY
      - name: Сбор и подготовка без публикации
        env:
          GEMINI_API_KEY: ${{ inputs.analyze && secrets.GEMINI_API_KEY || '' }}
          ANALYZE: ${{ inputs.analyze }}
        run: |
          if [ "$ANALYZE" = true ]; then
            python -m relocant_media.ops.actions_cycle --analyze
          else
            python -m relocant_media.ops.actions_cycle
          fi
      - name: Сохранить состояние даже при ошибке обработки
        if: ${{ always() && steps.validate.outcome == 'success' && hashFiles('state/editorial.sqlite3') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-sqlite
          path: state/editorial.sqlite3
          retention-days: 90
          if-no-files-found: error
      - name: Сохранить отчёт
        if: ${{ always() && hashFiles('reports/summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-report
          path: reports/summary.json
          retention-days: 30




