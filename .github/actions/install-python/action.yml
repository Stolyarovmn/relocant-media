name: Install locked Python dependencies
description: Install verified, reproducible dependencies for the selected profile
inputs:
  profile:
    description: Dependency profile (runtime or dev)
    default: runtime
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements/*.lock
    - name: Install packages and application
      run: python scripts/install_python.py "$PYTHON_INSTALL_PROFILE"
      shell: bash
      env:
        PYTHON_INSTALL_PROFILE: ${{ inputs.profile }}
