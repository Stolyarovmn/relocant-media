[project]
name = "relocant-media"
version = "0.1.0"
description = "Automation platform for local Telegram media channels for relocants"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "feedparser>=6.0.11,<7",
  "PyYAML>=6.0,<7",
  "google-genai>=2.31,<3",
  "Telethon>=1.45,<2",
]

[project.scripts]
relocant-ingest = "relocant_media.ingestion.cli:main"
relocant-editorial = "relocant_media.ops.editorial_cli:main"
relocant-package = "relocant_media.ops.package_cli:main"
relocant-media = "relocant_media.ops.media_cli:main"
relocant-collect = "relocant_media.ops.collect_cli:main"
relocant-candidates = "relocant_media.ops.candidates_cli:main"
relocant-newsroom = "relocant_media.ops.newsroom_status:main"
relocant-revision-control = "relocant_media.ops.revision_control_cli:main"
relocant-correction-control = "relocant_media.ops.correction_control_cli:main"
relocant-ad-review = "relocant_media.ops.ad_review_cli:main"
relocant-ad-price = "relocant_media.ops.ad_pricing_cli:main"
relocant-measure = "relocant_media.analytics.cli:main"
relocant-public-preview = "relocant_media.ops.public_preview_cli:main"
relocant-smoke = "relocant_media.ops.smoke:main"
relocant-webhook = "relocant_media.ops.webhook:main"
relocant-schedule = "relocant_media.scheduler.cli:main"
relocant-mtproto = "relocant_media.analytics.mtproto_cli:main"
relocant-telegram-bootstrap = "relocant_media.ops.telegram_bootstrap_cli:main"
relocant-ads-analyze = "relocant_media.ops.ads_analysis_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio<1,>=0.25",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["relocant_media"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "feedparser"]
ignore_missing_imports = true
