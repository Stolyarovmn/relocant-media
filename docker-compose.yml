services:
  postgres:
    image: postgres:17-alpine
    profiles: ["staging", "analytics"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relocant}
      POSTGRES_USER: ${POSTGRES_USER:-relocant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relocant} -d ${POSTGRES_DB:-relocant}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    profiles: ["staging"]
    environment:
      APP_ENV: staging
      CITY_ID: ${CITY_ID:-belgrade}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TELEGRAM_RUNTIME_ENABLED: ${TELEGRAM_RUNTIME_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_STAGING_CHANNEL_ID: ${TELEGRAM_STAGING_CHANNEL_ID:-}
      TELEGRAM_STAGING_DISCUSSION_GROUP_ID: ${TELEGRAM_STAGING_DISCUSSION_GROUP_ID:-}
      TELEGRAM_STAGING_FORUM_GROUP_ID: ${TELEGRAM_STAGING_FORUM_GROUP_ID:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_DISCUSSION_GROUP_ID: ${TELEGRAM_DISCUSSION_GROUP_ID:-}
      TELEGRAM_FORUM_GROUP_ID: ${TELEGRAM_FORUM_GROUP_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true

  analytics:
    build: .
    profiles: ["analytics"]
    environment:
      APP_ENV: staging
      CITY_ID: ${CITY_ID:-belgrade}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TELEGRAM_MTPROTO_ENABLED: "true"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_MTPROTO_SESSION_PATH: /run/telegram/analytics.session
      TELEGRAM_MTPROTO_CHANNEL_ID: ${TELEGRAM_MTPROTO_CHANNEL_ID:-}
      TELEGRAM_BOOTSTRAP_STATE_PATH: /run/telegram/staging-topology.json
    volumes:
      - telegram_analytics_session:/run/telegram
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
    restart: unless-stopped
    init: true

volumes:
  pgdata:
  telegram_analytics_session:
