services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relocant
      POSTGRES_USER: relocant
      POSTGRES_PASSWORD: relocant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relocant -d relocant"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
