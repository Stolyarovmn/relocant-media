services:
  postgres:
    image: postgres:17-alpine
    profiles: ["staging"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relocant}
      POSTGRES_USER: ${POSTGRES_USER:-relocant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relocant} -d ${POSTGRES_DB:-relocant}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    profiles: ["staging"]
    env_file: .env
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true

volumes:
  pgdata:
