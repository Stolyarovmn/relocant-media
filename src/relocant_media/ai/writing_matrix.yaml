version: ru-local-news-v1
common: >-
  Один пост — один повод. Заголовок обычно 6–12 слов: конкретное изменение, действие или
  событие; место, дата или число — если помогают понять суть. Ставь главное в начало.
  Первый абзац раскрывает, кого касается новость и что меняется; не повторяй заголовок
  дословно. Затем 2–4 коротких блока по одной мысли. Не начинай с названия ведомства,
  если само ведомство не суть новости. Для прямой речи и спорных утверждений укажи источник.
  Пиши естественным русским: «воду отключат» вместо «будет приостановлена подача воды».
  Используй знакомые русские названия; оригинальное название улицы или площадки сохрани,
  если оно помогает найти адрес. Не переводи собственные имена буквально.
  Даты абсолютные («14 ноября»), часы местные, в формате 24 ч. Если год нужен для ясности,
  укажи его. Делай пустые строки между абзацами; для плотных данных используй знакомые
  подписи («Где», «Когда», «Билеты», «Объезд»), простой список для нескольких адресов или шагов.
  Используй простой текст. Шаблон добавит оформление, одну метку и ссылку «Источник».
  Не дублируй в заголовке и тексте сырой URL первоисточника. Короткую цитату используй,
  когда важны именно слова человека; авторство укажи рядом.
  В обычной новости допустим один тематический эмодзи после подписи отдельного блока,
  например «Объезд: 🚧 …». Заголовок и предложения пиши словами, без эмодзи внутри фразы и без
  цепочек эмодзи. Для постов о пострадавших и обвинениях используй только текст.
  Карта открывается кнопкой, если место уже подтверждено штатной проверкой.
  Для афиши сохрани указанные ограничения участия: язык, возраст, пол, район или членство.
  Диапазон слов относится к основному тексту. Существенные условия и адреса важнее диапазона;
  короткий достоверный пост не дополняй общими фразами. Без ложной срочности, кликбейта,
  усиления эмоций, обещаний и советов, не подтверждённых источником.
context: >-
  Поле writing_calendar содержит местное время подготовки. Утром выноси вперёд действующее
  изменение маршрута или услуги, днём — доступное действие и его срок, вечером — подтверждённые
  планы на следующий день, если это суть новости. Ночью важны действующие срочные изменения;
  ближайшее изменение всё равно описывай точной датой и временем. Не предполагай привычки
  читателя по одному часу. Выходной, праздник, сезон, погоду и освещённость учитывай только
  при подтверждённом влиянии на расписание, дорогу, работу службы или условия посещения.
  Календарь подготовки не подтверждает погоду, праздничный режим или сезонную причину.
  Не подменяй факты текущей погодой и не добавляй её к постороннему сюжету.
weather: >-
  Если центральный факт — официальное погодное предупреждение, его формат важнее общего
  формата категории. Используй 35–90 слов:
  явление → район → точный период и уровень, если объявлен → подтверждённое последствие
  и указание службы. Тон спокойный и прямой. Назови прогноз прогнозом, не объявляй
  последствия уже наступившими. Для подтверждённого переноса события или маршрута из-за
  погоды начни с переноса и нового расписания; источник прогноза сам по себе его не доказывает.
guide: >-
  Справка или инструкция — 90–180 слов. Кому нужна → что сделать по шагам → документы,
  срок и стоимость → исключения. Тон деловой и поддерживающий, без обещания результата.
formats:
  transport:
    categories: [transport]
    words: [45, 100]
    structure: Изменение и участок или маршрут → точный период → направление или остановки → подтверждённый объезд.
    tone: Спокойный, оперативный, без эпитетов.
  utilities:
    categories: [utilities]
    words: [40, 100]
    structure: Что отключат и где → период → точные адреса или подтверждённая граница → информация службы.
    tone: Нейтральный, практичный, без драматизации и обещаний восстановления.
  events:
    categories: [events]
    words: [55, 110]
    structure: Что за событие и чем примечательно → дата и время → площадка → цена, регистрация и ограничения.
    tone: Тёплый и конкретный, без рекламных оценок, искусственного ажиотажа и домыслов об аудитории.
  incident:
    categories: [crime, accusations]
    words: [35, 90]
    structure: Что подтверждено и кем → место и время → что известно о последствиях → подтверждённое действие или следующий шаг.
    tone: Сдержанный и уважительный; при вреде уместно сочувствие. Различай обвинение и установленный факт.
  decisions:
    categories: [banking, economy, health, immigration, jobs, law, medicine, politics, real_estate, schools, tax]
    words: [75, 150]
    structure: Что изменится и для кого → статус решения и дата → применимые условия, суммы или исключения → следующий подтверждённый шаг.
    tone: Деловой, ясный, без паники, агитации, индивидуальных советов и обещаний.
  city_life:
    categories: [culture, sport]
    words: [60, 130]
    structure: Результат или новое обстоятельство → конкретная деталь → значение для города по источнику → что дальше, если известно.
    tone: Живой и спокойный; интерес передавай деталями, без рекламной лексики.
  city:
    categories: [city]
    words: [50, 110]
    structure: Что произошло или изменится → кого и где затронет → главная подтверждённая деталь → следующий шаг, если известен.
    tone: Прямой и нейтральный, степень уверенности соответствует источнику.
