# Правила хештегов, версия 2 (оформление пакета version >= 6). Версию 1 не менять:
# она нужна для проверки сохранённых пакетов.
# На пост выходит один публичный хештег. Район показывается в тексте и фильтре Mini App.
fallback: "#Город"
categories:
  accusations: "#Общество"
  banking: "#Банки"
  city: "#Город"
  crime: "#Безопасность"
  culture: "#Культура"
  economy: "#Экономика"
  events: "#События"
  health: "#Здоровье"
  immigration: "#Документы"
  jobs: "#Работа"
  law: "#Право"
  medicine: "#Медицина"
  politics: "#Политика"
  real_estate: "#Жильё"
  schools: "#Школы"
  sport: "#Спорт"
  tax: "#Налоги"
  transport: "#Транспорт"
  utilities: "#Коммуналка"
# Рубрика «Люди и город» отделяет городские истории от изменений в городе.
# Применяется только к category city и к неизвестной категории (fallback).
rubric_overrides:
  city_life: "#Истории"
# Строки прежних версий оформления: распознаются как хвост, но новым постам не выдаются.
legacy_lines:
  - "#События #Досуг"
