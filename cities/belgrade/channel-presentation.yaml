  # Закреп «Правила». Применяется на месте: workflow «Описание и карта канала», texts+apply.
  html: |-
    <b>Правила «Еду в Белград»</b>

    Новости, транспорт, отключения и события Белграда по-русски, с источниками.

    <b>Рубрики</b>
    #Транспорт · #Коммуналка · #События · #Культура · #Спорт · #Город · #Истории

    <b>Сводки</b>
    «Белград сегодня» выходит утром в 07:30. «Главное за день» — вечером в 20:30. Время белградское.

    <b>Как мы работаем</b>
    Проверяем факты и указываем, откуда сведения. Сообщения читателей помечаем отдельно. Ошибки исправляем в посте, существенные изменения отмечаем обновлением.

    <b>В комментариях</b>
    Уважаем собеседников. Спам, травлю и раскрытие чужих данных удаляем.

    Предложить новость или обсудить сотрудничество — <a href="https://t.me/eduvbelgrad/6">в соседнем закрепе</a>.
