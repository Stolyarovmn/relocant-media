  # Закреп «Предложка и сотрудничество». Применяется на месте вместе с «Правилами».
  html: |-
    <b>Предложка и сотрудничество</b>

    <b>Предложить новость</b>
    <a href="https://t.me/relocant_media_belgrade_bot">Напишите боту</a>. Расскажите, что, где и когда произошло. Если есть источник, фото или видео, приложите их. Для исправления добавьте ссылку на наш пост. Номер обращения придёт после выбора темы.

    Редакция проверяет материал перед публикацией. Если он подойдёт, бот отдельно спросит разрешение и предложит выбрать подпись. Не присылайте документы, банковские данные и чужие личные контакты.

    <b>Сотрудничество и реклама</b>
    Открыты к местным проектам: кафе, площадкам, организаторам событий и городским сервисам. Напишите <a href="https://t.me/relocant_media_belgrade_bot">боту</a> или в сообщения канала, затем выберите «Редакционное партнёрство» или «Платное размещение». Расскажите о проекте, датах, формате и ориентире бюджета.

    Рекламу обозначаем явно. Оплата не влияет на редакционную оценку. Условия согласуем до оплаты; запрос не является бронью.
