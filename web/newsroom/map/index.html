<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19362d">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'">
  <title>Карта Белграда · Relocant Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin defer></script>
  <script type="module" src="app.js?v=7"></script>
</head>
<body>
  <a class="skip-link" href="#announcements">К списку объявлений</a>
  <header class="topbar">
    <a class="brand" href="https://t.me/eduvbelgrad" target="_blank" rel="noopener noreferrer">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span class="brand-label">Relocant Media</span>
      <span class="brand-mobile" aria-hidden="true">Карта Белграда</span>
    </a>
    <button class="sync" id="refresh" type="button" aria-label="Обновить объявления">
      <span id="sync-stamp" role="status">Загрузка объявлений</span>
      <span aria-hidden="true">↻</span>
    </button>
  </header>

  <main class="workspace">
    <section class="controls" aria-labelledby="page-title">
      <h1 id="page-title">Карта Белграда</h1>
      <nav class="map-modes" aria-label="Разделы карты">
        <button id="show-incidents" type="button" aria-pressed="true" aria-controls="announcements">
          Городские работы
        </button>
        <button id="show-places" type="button" aria-pressed="false" aria-controls="places">
          Куда сходить
        </button>
      </nav>
      <div id="incident-controls">
        <form id="address-form" class="address-form" role="search">
          <label class="sr-only" for="address-query">Улица и номер дома</label>
          <div class="address-field">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="address-query" type="search" inputmode="search" placeholder="Улица и номер дома"
                   autocomplete="off" spellcheck="false" aria-controls="address-results">
            <button type="submit">Найти</button>
          </div>
          <div id="address-results" class="address-results" hidden></div>
        </form>
        <div id="layer-filter" class="layers" role="group" aria-label="Слои карты">
          <button type="button" data-kind="water" aria-pressed="true"><i aria-hidden="true"></i>Вода</button>
          <button type="button" data-kind="power" aria-pressed="true"><i aria-hidden="true"></i>Свет</button>
          <button type="button" data-kind="road" aria-pressed="true"><i aria-hidden="true"></i>Дороги</button>
        </div>
        <div id="picked-address" class="picked-address" hidden>
          <div><strong id="picked-label"></strong><p id="picked-match"></p></div>
          <button id="clear-address" class="icon-button" type="button" aria-label="Сбросить выбранный адрес">×</button>
        </div>
      </div>
      <div id="places-controls" class="places-controls" hidden>
        <button type="button" id="locate-places" class="locate-places">
          <span class="locate-icon" aria-hidden="true"></span> Показать расстояния
        </button>
        <button type="button" id="clear-location" class="clear-location" hidden>Сбросить</button>
        <p id="location-status" class="location-status" role="status" hidden></p>
      </div>
    </section>

    <section class="map-frame" aria-label="Карта Белграда и окрестностей">
      <div id="map" aria-label="Интерактивная карта"></div>
      <button id="reset-map" class="map-reset" type="button" aria-label="Весь Белград" title="Весь Белград">
        <i aria-hidden="true"></i><span>Весь Белград</span>
      </button>
      <p id="map-message" class="map-message" role="status" hidden></p>
    </section>

    <section id="announcements" class="announcements" aria-labelledby="announcements-title">
      <header class="list-header">
        <h2 id="announcements-title">
          <button id="toggle-announcements" type="button" aria-expanded="true" aria-controls="announcement-body">
            Объявления <span id="event-count"></span><i aria-hidden="true"></i>
          </button>
        </h2>
      </header>
      <button id="selected-preview" class="selected-preview" type="button" hidden>
        <i aria-hidden="true"></i>
        <span class="selected-main">
          <span id="selected-title"></span><small id="selected-countdown"></small>
        </span>
        <span aria-hidden="true">›</span>
      </button>
      <p id="feedback" class="feedback" role="status">Загружаем данные.</p>
      <div id="announcement-body" class="announcement-body">
        <div id="event-list" class="event-list"></div>
      </div>
    </section>
    <section id="places" class="announcements places" aria-labelledby="places-title" hidden>
      <header class="list-header">
        <h2 id="places-title">
          <button id="toggle-places" type="button" aria-expanded="true" aria-controls="places-body">
            События <span id="places-count" class="places-count"></span><i aria-hidden="true"></i>
          </button>
        </h2>
      </header>
      <div id="place-detail" class="place-detail" hidden></div>
      <p id="places-feedback" class="feedback" role="status" hidden></p>
      <div id="places-body" class="announcement-body">
        <div id="places-list" class="places-list"></div>
      </div>
    </section>
  </main>
  <noscript><p class="noscript">Для просмотра карты включите JavaScript.</p></noscript>
</body>
</html>
