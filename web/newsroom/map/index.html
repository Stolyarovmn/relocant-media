<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19362d">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'">
  <title>Карта Белграда · Relocant Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#announcements">К списку объявлений</a>
  <header class="topbar">
    <a class="brand" href="https://t.me/eduvbelgrad" target="_blank" rel="noopener noreferrer">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      Relocant Media
    </a>
    <button class="sync" id="refresh" type="button" aria-label="Обновить объявления">
      <span id="sync-stamp" role="status">Загрузка объявлений</span>
      <span aria-hidden="true">↻</span>
    </button>
  </header>

  <main class="workspace">
    <section class="controls" aria-labelledby="page-title">
      <h1 id="page-title">Карта Белграда</h1>
      <form id="address-form" class="address-form" role="search">
        <label class="sr-only" for="address-query">Улица и номер дома</label>
        <div class="address-field">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="address-query" type="search" inputmode="search" placeholder="Улица и номер дома"
                 autocomplete="off" spellcheck="false" aria-controls="address-results">
          <button type="submit">Найти</button>
        </div>
        <div id="address-results" class="address-results" hidden></div>
      </form>
      <div id="layer-filter" class="layers" role="group" aria-label="Слои карты">
        <button type="button" data-kind="water" aria-pressed="true"><i aria-hidden="true"></i>Вода</button>
        <button type="button" data-kind="power" aria-pressed="true"><i aria-hidden="true"></i>Свет</button>
        <button type="button" data-kind="road" aria-pressed="true"><i aria-hidden="true"></i>Дороги</button>
      </div>
      <div id="picked-address" class="picked-address" hidden>
        <div><strong id="picked-label"></strong><p id="picked-match"></p></div>
        <button id="clear-address" class="icon-button" type="button" aria-label="Сбросить выбранный адрес">×</button>
      </div>
    </section>

    <section class="map-frame" aria-label="Карта Белграда и окрестностей">
      <div id="map" aria-label="Интерактивная карта"></div>
      <button id="reset-map" class="map-reset" type="button">Весь Белград</button>
      <p id="map-message" class="map-message" role="status" hidden></p>
    </section>

    <section id="announcements" class="announcements" aria-labelledby="announcements-title">
      <header class="list-header">
        <h2 id="announcements-title">Объявления <span id="event-count"></span></h2>
        <label class="archive-filter"><input id="archive" type="checkbox"> Завершённые</label>
      </header>
      <p id="feedback" class="feedback" role="status">Загружаем данные.</p>
      <div id="event-list" class="event-list"></div>
    </section>
  </main>
  <noscript><p class="noscript">Для просмотра карты включите JavaScript.</p></noscript>
</body>
</html>
